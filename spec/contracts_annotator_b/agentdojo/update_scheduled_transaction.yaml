preconditions:
  - id: pre.transaction_exists
    text: "a scheduled transaction with the given id must exist"
    predicate: "any(t.id == args.id for t in pre.bank_account.scheduled_transactions)"
    provenance:
      surface: tool_return
      file: src/agentdojo/default_suites/v1/tools/banking_client.py
      line: 147
      quote: "Transaction with ID {id} not found."

effects:
  - id: eff.recipient_updated_if_given
    text: "if a recipient is provided, the scheduled transaction's recipient is updated to it"
    predicate: >
      all(
        post_t.recipient == args.recipient
        for pre_t in pre.bank_account.scheduled_transactions
        for post_t in post.bank_account.scheduled_transactions
        if pre_t.id == args.id and post_t.id == args.id
      ) if args.recipient != None else True
    provenance:
      surface: docstring
      file: src/agentdojo/default_suites/v1/tools/banking_client.py
      line: 128
      quote: ":param recipient: IBAN of the recipient (optional)"

