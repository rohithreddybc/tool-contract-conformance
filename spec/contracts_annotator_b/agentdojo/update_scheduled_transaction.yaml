frame:
  - id: frame.transactions_list_unchanged
    path: bank_account.transactions
    mode: unchanged
    text: "updating a scheduled transaction does not touch the already-executed transaction history"
    inferred: true

  - id: frame.balance_unchanged
    path: bank_account.balance
    mode: unchanged
    text: "updating a scheduled transaction's details does not move money"
    inferred: true

  - id: frame.iban_unchanged
    path: bank_account.iban
    mode: unchanged
    text: "the account's own IBAN is untouched by editing a scheduled transaction"
    inferred: true

  - id: frame.scheduled_id_unchanged
    path: bank_account.scheduled_transactions.[].id
    mode: unchanged
    text: "the transaction id is a lookup key, not one of the five documented optional fields, so it does not change"
    inferred: true

  - id: frame.scheduled_sender_unchanged
    path: bank_account.scheduled_transactions.[].sender
    mode: unchanged
    text: "sender is not among the documented optional parameters, so it does not change"
    inferred: true

success_signal:
  predicate: "'message' in result"
  biconditional: true
  justification: >
    The function has no documented failure return shape; the only observed control flow is a
    confirmation dict on the path where the transaction is found, or a raised ValueError before
    any assignment on the path where it is not. A returned message is therefore the interface's
    only agent-visible signal that the requested field updates for the given id were applied.
    No effect here is advertised as deferred.
  provenance:
    surface: tool_return
    file: src/agentdojo/default_suites/v1/tools/banking_client.py
    line: 150
    quote: "\"message\": f\"Transaction with ID {id} updated.\""

on_precondition_violation:
  expect:
    error_signal: true
    state_delta: none
    error_type: ValueError
  provenance:
    surface: tool_return
    file: src/agentdojo/default_suites/v1/tools/banking_client.py
    line: 147
    quote: "Transaction with ID {id} not found."

notes: >
  This docstring has no "Raises:" section; the ValueError promise and the "not found" precondition
  are both grounded in tool_return (the message of the raised exception itself, per the schema's
  tool_return definition: "a string the tool actually returns or raises, which the agent sees"),
  not in maintainer_annotation, since the exception message is on the agent-visible path, unlike a
  logger call or comment. state_delta: none for the violation path is a structural inference from
  the function's control flow (the raise happens in an else-branch before any assignment) rather
  than a textual promise; I flag this because the annotator checklist asks for exactly this
  distinction and no explicit "no effect on failure" sentence exists here to cite. The `account`
  parameter is a Depends-injected runtime dependency, not part of the function-calling schema the
  agent sees, so it is excluded from signature.args. I did not attempt to model the five
  update-if-given effects with an "is not None" comparison operator: Python's `is`/`is not`
  compile to ast.Is/IsNot, which are not in the predicate grammar's ALLOWED_CMPOPS, so all five
  guards use `!=` against a None literal instead.
