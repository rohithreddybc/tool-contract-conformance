contract_version: "1.0"
tool: venmo_social
benchmark: mmtoolsandbox
commit: 1e8e9324abcb741cc6a9718f9e7c1b80e85a1363
source:
  file: mmtoolsandbox/tools/mini/venmo.py
  start_line: 345
  end_line: 486
  note: >
    venmo_social is a domain/action dispatcher that forwards to functions in
    mmtoolsandbox.tools.appworld.venmo via the _get() indirection at lines 417-481; this
    contract covers only the friend-add, friend-remove, and like-toggle branches, the clearest
    single-sentence promises in the docstring. See notes for what was left uncovered.

