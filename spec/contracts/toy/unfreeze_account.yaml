contract_version: "1.0"
tool: unfreeze_account
benchmark: toy
commit: "0000000"
source:
  file: toy/bank.py
  start_line: 155
  end_line: 164

signature:
  args:
    account_id: { type: str, effective: true }

preconditions:
  - id: pre.account_exists
    text: "the account must exist"
    predicate: "args.account_id in pre.accounts"
    provenance:
      surface: docstring
      file: toy/bank.py
      line: 156
      quote: "The account must exist and must"

  - id: pre.currently_frozen
    text: "the account must currently be frozen"
    predicate: "pre.accounts[args.account_id].frozen"
    provenance:
      surface: docstring
      file: toy/bank.py
      line: 157
      quote: "currently be frozen"

effects:
  - id: eff.frozen_cleared
    text: "the account becomes unfrozen"
    predicate: "post.accounts[args.account_id].frozen == False"
    provenance:
      surface: docstring
      file: toy/bank.py
      line: 156
      quote: "restoring normal operation"

frame:
  - id: frame.balances_unchanged
    path: state.accounts.*.balance
    text: "unfreezing never changes any balance"
    mode: unchanged
    inferred: true
  - id: frame.owner_unchanged
    path: state.accounts.*.owner
    text: "unfreezing never changes who owns an account"
    mode: unchanged
    inferred: true
  - id: frame.items_unchanged
    path: state.items
    text: "unfreeze_account never touches items"
    mode: unchanged
    inferred: true
  - id: frame.locks_unchanged
    path: state.locks
    text: "unfreeze_account never touches locks"
    mode: unchanged
    inferred: true

success_signal:
  predicate: "'error' not in result"
  biconditional: true
  justification: >
    unfreeze_account returns {frozen: false} on the only success path and raises ToyError on
    every declared failure; no effect is advertised as deferred.
  provenance:
    surface: docstring
    file: toy/bank.py
    line: 155
    quote: "Unfreeze `account_id`"

on_precondition_violation:
  expect:
    error_signal: true
    state_delta: none
  provenance:
    surface: docstring
    file: toy/bank.py
    line: 157
    quote: "currently be frozen"

reset:
  predicate: "post == pre"
  scope: per_task
