success_signal:
  predicate: "'error' not in result"
  biconditional: true
  justification: >
    Every raise (non-delivered order, missing/duplicate item ids, unavailable new item,
    insufficient gift-card balance -- lines 241-275) occurs before the mutation block at lines
    278-282 (status, exchange_items, exchange_new_items, exchange_payment_method_id,
    exchange_price_difference); no raise is reachable after it. No effect on this tool is
    advertised as deferred -- the recorded exchange fields ARE the whole advertised effect of a
    successful call; the physical item swap and payment settlement are advertised as a separate,
    later process (see frame.items_unchanged above and the notes below).
  provenance:
    surface: prompt_template
    file: data/tau2/domains/retail/policy.md
    line: 136
    quote: "the order status will be changed to 'exchange requested'"

reset:
  predicate: "post == pre"
  scope: per_task

notes: >
  TRUE NEGATIVE (reported per task brief, not a finding): exchange_delivered_order_items reads
  the requested items, validates them, computes exchange_price_difference, and checks gift-card
  balance sufficiency -- but never mutates order.items and never mutates any payment method's
  balance, unlike its pending-order sibling modify_pending_order_items (which performs the item
  swap and the gift-card balance update synchronously, tools.py:521-539). This looks at first
  read like Finding-2/3-shaped asymmetry (one direction writes, the paired direction only
  validates), but retail/policy.md's "Exchange delivered order" section states the outcome
  explicitly and completely: "After user confirmation, the order status will be changed to
  'exchange requested', and the user will receive an email regarding how to return items. There
  is no need to place a new order." (policy.md:136) -- the deferral to a later, out-of-band
  process is advertised, not hidden. The asymmetry with modify_pending_order_items is real and
  intentional: a pending order has not shipped, so its items can be swapped immediately; a
  delivered order's items are in the customer's possession and cannot be swapped until they are
  physically returned. return_delivered_order_items (this file's sibling contract) has the
  identical shape for the same reason.
