  biconditional: true
  justification: >
    Every raise (customer not found at line 382, another bill already awaiting payment at line
    388, bill not found for customer at line 390) occurs before the single mutating statement
    (bill.status = BillStatus.AWAITING_PAYMENT, line 392); there is no raise after it. No effect
    on this tool is advertised as deferred.
  provenance:
    surface: prompt_template
    file: data/tau2/domains/telecom/main_policy.md
    line: 108
    quote: "This will change the status of the bill to AWAITING PAYMENT."

reset:
  predicate: "post == pre"
  scope: per_task

notes: >
  TRUE NEGATIVE (reported per task brief, not a finding), and an unusually strong instance of
  it: send_payment_request's own docstring states "Warning: This method does not check if the
  bill is already PAID. Always check the bill status before calling this method."
  (tools.py:369-370), AND main_policy.md independently and separately states the same
  non-enforcement at the prompt-template level: "The send payement request tool will not check
  if the bill is overdue. You should always check that the bill is overdue before sending a
  payment request." (main_policy.md:117, sic on "payement"). Both agent-visible surfaces
  disclaim a check the code does not perform, at two different granularities (PAID-status in the
  docstring, overdue-status in the policy) -- deliberately not encoded as a precondition clause
  here, since encoding it would misrepresent the interface's own claim. This is exactly the
  "detector that knows when not to fire" case the task brief asks to be reported for SS V,
  doubly so because the non-enforcement is advertised on two independent agent-visible surfaces
  rather than one.
