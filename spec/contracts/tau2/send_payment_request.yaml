    text: "the bill must belong to the customer"
    predicate: "any(args.bill_id in c.bill_ids for c in pre.customers if c.customer_id == args.customer_id)"
    provenance:
      surface: tool_return
      file: src/tau2/domains/telecom/tools.py
      line: 390
      quote: "not found for customer"

effects:
  - id: eff.bill_awaiting_payment
    text: "the bill's status becomes Awaiting Payment"
    predicate: "any(b2.bill_id == args.bill_id and b2.status == 'Awaiting Payment' for b2 in post.bills)"
    provenance:
